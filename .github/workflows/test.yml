name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Add the tap
        run: brew tap joshuadavidthomas/homebrew
      - name: Check formula style
        run: brew style Formula/django-language-server.rb
      - name: Audit formula
        run: brew audit --formula joshuadavidthomas/homebrew/django-language-server
      - name: Install formula
        run: brew install joshuadavidthomas/homebrew/django-language-server
      - name: Test formula
        run: brew test joshuadavidthomas/homebrew/django-language-server
